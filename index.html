<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abi - Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Sora', sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Theme Utilities */
      @layer utilities {
          @keyframes draw-progress {
              from { stroke-dashoffset: 251.2; }
              to { stroke-dashoffset: 62.8; }
          }
          .progress-ring-circle {
              animation: draw-progress 1.5s ease-out forwards;
          }
          .bg-iridescent {
              background-image: linear-gradient(120deg, rgba(238, 130, 238, 0.1), rgba(0, 255, 255, 0.1));
          }
          /* Fallback for rounded borders with gradient look - using solid semi-transparent for compatibility with rounded-3xl */
          .border-iridescent {
                border-color: rgba(255, 255, 255, 0.2);
          }
          .icon-glow {
                filter: drop-shadow(0 0 8px var(--glow-color));
                text-shadow: 0 0 12px var(--glow-color);
          }
          .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
          }
          .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
          }
          .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
          }
          .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
          }
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#00F5D4", // Luminous Cyan/Mint
              secondary: "#9B5DE5", // Soft Purple
              background: "#10002B", // Deep Purple
              surface: "#240046", // Darker Purple Surface
              "glass-dark": "rgba(36, 0, 70, 0.3)", // Purple-tinted glass
              "glass-light": "rgba(255, 255, 255, 0.05)",
              "text-primary": "#E0AAFF", // Light Lavender
              "text-secondary": "#C77DFF", // Brighter Lavender
              "border-dark": "rgba(255, 255, 255, 0.15)", // Softer border
            },
            fontFamily: {
              display: ["Sora", "sans-serif"],
              sans: ["Sora", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1.25rem",
              lg: '1.5rem',
              xl: '2rem', 
              '2xl': '2.5rem',
              '3xl': '3rem',
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(155, 93, 229, 0.1)',
              'glow-primary': '0 0 20px rgba(0, 245, 212, 0.3)',
              'glow-secondary': '0 0 20px rgba(155, 93, 229, 0.3)',
            },
          },
        },
      };
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body class="font-display bg-background text-text-primary antialiased bg-gradient-to-br from-background via-[#020024] to-[#3C096C] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
