name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locked frontend installation
        run: bun install --frozen-lockfile
      - name: Frontend quality gate
        run: bun run check
      - name: Locked backend installation
        run: pip install -r backend/requirements.lock
      - name: Backend lint and behavior tests
        run: |
          pip install ruff
          ruff check backend
          python -m unittest discover -s backend/tests -v
      - name: Dependency and source security audits
        run: |
          bun audit
          pip install pip-audit bandit
          pip-audit -r backend/requirements.lock
          bandit -r backend -x backend/tests,backend/alembic -f screen
